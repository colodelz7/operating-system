# Serve o build do frontend e encaminha /api para a API, tudo na mesma
# origem: o cookie de sessao continua funcionando sem CORS.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # A API cuida dos proprios cabecalhos de seguranca; aqui protegemos o HTML.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  client_max_body_size 30m;

  # SSE das notificacoes: sem buffer e sem timeout curto, senao o nginx
  # segura os eventos e derruba a conexao.
  location /api/notificacoes/stream {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # O assistente conversa com um modelo externo e pode levar dezenas de
  # segundos. O teto aqui e maior que o do resto da API, mas ainda existe:
  # o backend corta a conversa antes disso e responde por conta propria.
  location /api/assistente {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
  }

  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # assets com hash no nome podem ser cacheados a vontade
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # rotas do React Router caem no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
